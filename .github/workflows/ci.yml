# 持续集成：push/PR 即运行 lint、类型检查、前端测试（含架构守卫）与
# Rust 测试，另带 Windows 编译与 lib 测试 job。发布构建（build.yml）的
# gate job 会在打 tag 时重跑同一套验证，全部通过才产出构建产物；日常
# 开发中的架构守卫（原 DOMAIN_ARCHITECTURE_PLAN.md §5.4）由本工作流保证。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: copy-creator/pnpm-lock.yaml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: copy-creator/src-tauri

      - name: 安装 Linux 系统依赖（Tauri/Rust 测试需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: copy-creator

      - name: Lint
        run: pnpm lint
        working-directory: copy-creator

      - name: 类型检查
        run: pnpm typecheck
        working-directory: copy-creator

      - name: 前端测试（含架构守卫）
        run: pnpm test
        working-directory: copy-creator

      - name: Rust 测试
        run: cargo test
        working-directory: copy-creator/src-tauri

  windows:
    # Windows 专属代码（OLE 拖出、低级键盘钩子、注册表自启动）过去只在
    # 发版构建时才编译，编译错误会潜伏到打 tag 当天才暴露。日常门禁补上
    # Windows 侧的编译检查与 lib 测试（debug 构建不需要前端 dist 产物）。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: copy-creator/src-tauri

      - name: Rust 编译检查
        run: cargo check
        working-directory: copy-creator/src-tauri

      # lib 测试进程需要嵌入 Common-Controls v6 manifest 才能启动，
      # test.cmd 经 RUSTFLAGS 注入（本仓库 Windows 跑测试的既定方式）。
      - name: Rust lib 测试
        shell: cmd
        run: test.cmd
        working-directory: copy-creator/src-tauri
