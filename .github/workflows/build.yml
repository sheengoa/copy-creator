name: Build

# 手动触发用于验证编译打包；推送 v* 标签时构建并发布 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: copy-creator/pnpm-lock.yaml

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: copy-creator/src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: copy-creator
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Copy Creator ${{ github.ref_name }}
          releaseBody: "双平台构建：Linux（deb / AppImage）与 Windows（exe / msi）。"
          releaseDraft: false
          prerelease: false

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            copy-creator/src-tauri/target/release/bundle/**/*.deb
            copy-creator/src-tauri/target/release/bundle/**/*.AppImage
            copy-creator/src-tauri/target/release/bundle/**/*.exe
            copy-creator/src-tauri/target/release/bundle/**/*.msi
