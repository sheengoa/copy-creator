name: Build

# 手动触发用于验证编译打包；推送 v* 标签时先跑质量门禁（lint / 前端测试 /
# 类型检查 / Rust 测试），全部通过后才构建并发布 GitHub Release。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 发布前的最后防线：与 ci.yml 同一套验证。未通过不产出任何构建产物。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: copy-creator/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: copy-creator/pnpm-lock.yaml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: copy-creator/src-tauri

      - name: 安装 Linux 系统依赖（Tauri/Rust 测试需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: copy-creator

      - name: Lint
        run: pnpm lint
        working-directory: copy-creator

      - name: 类型检查
        run: pnpm typecheck
        working-directory: copy-creator

      - name: 前端测试（含架构守卫）
        run: pnpm test
        working-directory: copy-creator

      - name: Rust 测试
        run: cargo test
        working-directory: copy-creator/src-tauri

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: copy-creator/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: copy-creator/pnpm-lock.yaml

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: copy-creator/src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          # runner 自带的 Google Chrome apt 源元数据时常不一致，会卡死
          # apt-get update（Hash Sum mismatch）；构建不需要 Chrome，先移除
          # （22.04 镜像为 .list，24.04 为 deb822 的 .sources）。
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: 安装前端依赖
        working-directory: copy-creator
        run: pnpm install --frozen-lockfile

      # 配置了 TAURI_SIGNING_PRIVATE_KEY 才启用更新产物生成（.sig + latest.json）；
      # 未配置时保持普通构建，本地 pnpm tauri build 也不受影响（开关只在 CI 传入）。
      - name: 检测更新签名密钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::notice::未配置 TAURI_SIGNING_PRIVATE_KEY，本次构建不生成更新产物"
          fi

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 密钥未配置时为空串：此时更新产物未启用，签名路径不会执行
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: copy-creator
          args: ${{ env.TAURI_UPDATER_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Copy Creator ${{ github.ref_name }}
          releaseBody: "双平台构建：Linux（deb / AppImage）与 Windows（exe / msi）。"
          releaseDraft: false
          prerelease: false

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            copy-creator/src-tauri/target/release/bundle/**/*.deb
            copy-creator/src-tauri/target/release/bundle/**/*.AppImage
            copy-creator/src-tauri/target/release/bundle/**/*.exe
            copy-creator/src-tauri/target/release/bundle/**/*.msi
