[package]
name = "copy-creator"
version = "0.3.6"
description = "PC clipboard manager, quick phrases, and translation tool"
authors = ["Copy Creator Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
# 仅用 spawn_blocking（rt）与 oneshot（sync），运行时由 tauri 自带。
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
enigo = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tauri-plugin-process = "2.3.1"
dirs = "5"
arboard = { version = "3", features = ["image-data"] }
drag = "2.1.1"
# 资源库目录监听：外部增删改文件后实时通知前端刷新
notify = "8"
# 数据备份导出/导入：整库打包为 zip（deflate 压缩即可，无需加密等特性）
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2"

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
# 径向菜单自研 OLE 文件拖出（shell 数据对象 + IDropSource + DoDragDrop）
windows = { version = "0.52", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
